version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TS 7 is the Go-native compiler; astro check needs the JS language-service API it lacks.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Types track the Node 24 LTS runtime (.nvmrc), not the newest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
