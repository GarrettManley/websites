<svg xmlns="http://www.w3.org/2000/svg" class="dgm" id="mtga-system" role="img" aria-labelledby="mtga-system-title" aria-describedby="mtga-system-desc" viewBox="0 0 340 584" width="440" height="756">
  <title id="mtga-system-title">mtga-companion: processes around one SQLite file</title>
  <desc id="mtga-system-desc">The game writes its log. A capture process reads the log through a shared handle and commits every entry to a raw table in one SQLite file. In the same process a versioned parser turns raw rows into derived tables and views. Writers pass one exclusive lock. A separate overlay process reads the raw rows read-only. An MCP server process answers Claude Code over stdio from the derived data through a read-only handle, and tries the lock at start-up without waiting.</desc>
  <defs>
    <marker id="mtga-system-arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="head" d="M0 0 L8 4 L0 8 Z" />
    </marker>
  </defs>

  <!-- Lanes and the gate first: the three writer traces are drawn over the gate. -->
  <rect class="lane" x="2" y="90" width="322" height="104" rx="6" />
  <rect class="gate" x="2" y="244" width="336" height="26" rx="4" />
  <rect class="lane" x="2" y="270" width="322" height="90" rx="6" />
  <rect class="lane" x="2" y="390" width="152" height="104" rx="6" />
  <rect class="lane" x="158" y="390" width="166" height="104" rx="6" />

  <rect class="ext" x="6" y="8" width="144" height="52" rx="4" />
  <rect class="box" x="6" y="118" width="144" height="66" rx="4" />
  <rect class="box" x="162" y="118" width="158" height="66" rx="4" />
  <rect class="store" x="6" y="298" width="144" height="52" rx="4" />
  <line class="rule" x1="10" y1="299.5" x2="146" y2="299.5" />
  <rect class="store" x="162" y="298" width="158" height="52" rx="4" />
  <line class="rule" x1="166" y1="299.5" x2="316" y2="299.5" />
  <rect class="box" x="6" y="418" width="144" height="66" rx="4" />
  <rect class="box" x="162" y="418" width="158" height="66" rx="4" />
  <rect class="ext" x="162" y="524" width="158" height="52" rx="4" />

  <!-- Game log to Capture -->
  <path class="edge" d="M18 60 V115.5" marker-end="url(#mtga-system-arrow)" />
  <!-- Capture to Raw entries, through the gate -->
  <path class="edge" d="M18 184 V295.5" marker-end="url(#mtga-system-arrow)" />
  <!-- Raw entries to Parser, through the gate -->
  <path class="edge" d="M44 298 V236 L52 228 H166 L174 220 V186.5" marker-end="url(#mtga-system-arrow)" />
  <!-- Parser to Derived data, through the gate -->
  <path class="edge" d="M308 184 V295.5" marker-end="url(#mtga-system-arrow)" />
  <!-- Raw entries to Overlay -->
  <path class="edge" d="M18 350 V415.5" marker-end="url(#mtga-system-arrow)" />
  <!-- Derived data to MCP server -->
  <path class="edge" d="M174 350 V415.5" marker-end="url(#mtga-system-arrow)" />
  <!-- MCP server to the gate, only at start-up -->
  <path class="edge cond" d="M320 451 H326 L331 446 V272.5" marker-end="url(#mtga-system-arrow)" />
  <!-- MCP server and Claude Code, both ways -->
  <path class="edge" d="M174 486.5 V521.5" marker-start="url(#mtga-system-arrow)" marker-end="url(#mtga-system-arrow)" />

  <text class="name" x="18" y="30">Game log</text>
  <text class="note" x="18" y="47">written by the game</text>
  <text class="lbl" x="24" y="79">shared read</text>

  <text class="lane-label" x="318" y="106" text-anchor="end">CAPTURE PROCESS</text>
  <text class="name" x="18" y="140">Capture</text>
  <text class="note" x="18" y="157">stores before parsing</text>
  <text class="tech" x="18" y="173">Rust std · fs4</text>
  <text class="name" x="174" y="140">Parser</text>
  <text class="note" x="174" y="157">raw rows to facts</text>
  <text class="tech" x="174" y="173">serde_json</text>

  <text class="lbl" x="24" y="210">insert</text>
  <text class="lbl" x="168" y="210" text-anchor="end">raw rows</text>
  <text class="lbl" x="302" y="210" text-anchor="end">replace</text>

  <text class="anno" x="176" y="261" text-anchor="middle">INGEST LOCK · ONE WRITER AT A TIME</text>

  <circle class="node" cx="68.5" cy="282" r="4.5" />
  <text class="lane-label" x="80" y="286">ONE SQLITE FILE · WAL</text>
  <text class="name" x="18" y="320">Raw entries</text>
  <text class="note" x="18" y="337">byte-exact, hashed</text>
  <text class="name" x="174" y="320">Derived data</text>
  <text class="note" x="174" y="337">18 tables, 14 views</text>

  <text class="lbl" x="24" y="379">read-only</text>
  <text class="lbl" x="168" y="379" text-anchor="end">read-only</text>
  <text class="lbl" x="325" y="379" text-anchor="end">at start</text>

  <text class="lane-label" x="148" y="406" text-anchor="end">OVERLAY PROCESS</text>
  <text class="name" x="18" y="440">Overlay</text>
  <text class="note" x="18" y="457">always-on-top window</text>
  <text class="tech" x="18" y="473">egui · glow</text>
  <text class="lane-label" x="318" y="406" text-anchor="end">MCP SERVER PROCESS</text>
  <text class="name" x="174" y="440">MCP server</text>
  <text class="note" x="174" y="457">15 read-only tools</text>
  <text class="tech" x="174" y="473">rmcp · tokio</text>

  <text class="lbl" x="180" y="513">stdio</text>
  <text class="name" x="174" y="546">Claude Code</text>
  <text class="note" x="174" y="563">asks the questions</text>
</svg>
