<svg xmlns="http://www.w3.org/2000/svg" class="dgm" id="mtga-tool-call" role="img" aria-labelledby="mtga-tool-call-title" aria-describedby="mtga-tool-call-desc" viewBox="0 0 340 538" width="440" height="696">
  <title id="mtga-tool-call-title">One tool call, from question to answer</title>
  <desc id="mtga-tool-call-desc">Claude Code calls the win-rate tool over stdio. A hand-written handler in the daemon crate passes the call to a dispatch function, which turns the arguments into a typed query. A statistics reader in the core library runs literal SQL against the statistics views in one read transaction. Each win and loss row becomes a cell with its sample size, rate and interval, or counts only below ten games. The response returns through dispatch and the handler as one text block.</desc>
  <defs>
    <marker id="mtga-tool-call-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="head" d="M0 0 L8 4 L0 8 Z" />
    </marker>
  </defs>

  <!-- Lanes -->
  <rect class="lane" x="2" y="94" width="336" height="196" rx="6" />
  <text class="lane-label" x="326" y="108" text-anchor="end">DAEMON CRATE</text>
  <rect class="lane" x="2" y="320" width="336" height="96" rx="6" />
  <text class="lane-label" x="326" y="334" text-anchor="end">CORE LIBRARY</text>
  <rect class="lane" x="2" y="446" width="168" height="82" rx="6" />
  <text class="lane-label" x="158" y="460" text-anchor="end">READ-ONLY SQLITE</text>

  <!-- Claude Code -->
  <rect class="ext" x="14" y="8" width="312" height="52" rx="4" />
  <text class="name" x="26" y="30">Claude Code</text>
  <text class="note" x="26" y="47">asks for win rates</text>

  <!-- Requests go down the left trace of each gap, responses come back up the right trace. -->
  <path class="edge" d="M26 60 V113" marker-end="url(#mtga-tool-call-arrow)" />
  <text class="lbl" x="32" y="81">tools/call</text>
  <path class="edge" d="M146 114 V61" marker-end="url(#mtga-tool-call-arrow)" />
  <text class="lbl" x="152" y="81">one text block</text>

  <!-- Server handler -->
  <rect class="box" x="14" y="114" width="312" height="66" rx="4" />
  <text class="name" x="26" y="136">Server handler</text>
  <text class="note" x="26" y="153">hand-written, stdio only</text>
  <text class="tech" x="26" y="169">rmcp · tokio</text>

  <path class="edge" d="M26 180 V213" marker-end="url(#mtga-tool-call-arrow)" />
  <text class="lbl" x="32" y="201">blocking thread</text>
  <path class="edge" d="M146 214 V181" marker-end="url(#mtga-tool-call-arrow)" />
  <text class="lbl" x="152" y="201">serialized once</text>

  <!-- Tool dispatch -->
  <rect class="box" x="14" y="214" width="312" height="66" rx="4" />
  <text class="name" x="26" y="236">Tool dispatch</text>
  <text class="note" x="26" y="253">typed arguments, unknown keys refused</text>
  <text class="tech" x="26" y="269">schemars · serde</text>

  <path class="edge" d="M26 280 V339" marker-end="url(#mtga-tool-call-arrow)" />
  <text class="lbl" x="32" y="309">typed query</text>
  <path class="edge" d="M146 340 V281" marker-end="url(#mtga-tool-call-arrow)" />
  <text class="lbl" x="152" y="309">header + body</text>

  <!-- Stats reader -->
  <rect class="box" x="14" y="340" width="144" height="66" rx="4" />
  <text class="name" x="26" y="362">Stats reader</text>
  <text class="note" x="26" y="379">one read snapshot</text>
  <text class="tech" x="26" y="395">reproduce_sql</text>

  <path class="edge" d="M158 373 H181" marker-end="url(#mtga-tool-call-arrow)" />

  <!-- Stats envelope: the amber marks where a rate is computed or withheld. -->
  <rect class="box" x="182" y="340" width="144" height="66" rx="4" />
  <text class="name" x="194" y="362">Stats envelope</text>
  <text class="note" x="194" y="379">rate, or withheld</text>
  <text class="tech" x="194" y="395">Wilson 95%</text>
  <path class="lane" d="M194 406 V456" />
  <circle class="node" cx="194" cy="406" r="4.5" />
  <text class="anno" x="182" y="470">under 10: counts only</text>
  <text class="anno" x="182" y="488">10 to 29: flagged rate</text>
  <text class="anno" x="182" y="506">30 or more: ok</text>

  <path class="edge" d="M26 406 V465" marker-end="url(#mtga-tool-call-arrow)" />
  <text class="lbl" x="32" y="435">literal SQL</text>

  <!-- Statistics views -->
  <rect class="store" x="14" y="466" width="144" height="52" rx="4" />
  <line class="rule" x1="18" y1="467.5" x2="154" y2="467.5" />
  <text class="name" x="26" y="488">Statistics views</text>
  <text class="note" x="26" y="505">14 SQL views</text>
</svg>
