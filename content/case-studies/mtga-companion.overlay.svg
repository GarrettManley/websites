<svg xmlns="http://www.w3.org/2000/svg" class="dgm" id="mtga-overlay" role="img" aria-labelledby="mtga-overlay-title" aria-describedby="mtga-overlay-desc" viewBox="0 0 340 410" width="440" height="531">
  <title id="mtga-overlay-title">The overlay: from a committed row to pixels</title>
  <desc id="mtga-overlay-desc">The overlay opens the SQLite file read-only. A poll thread asks every 250 milliseconds whether another connection has committed, reads the new raw rows and pushes them into an in-memory tracker that reuses the parser's code. The tracker produces a snapshot whose serialized fields are an allow-list of 37 key paths. The snapshot, joined with the record, crosses to a render thread over a channel, and that thread, which never reads the store, draws four boxes over the game.</desc>
  <defs>
    <marker id="mtga-overlay-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="head" d="M0 0 L8 4 L0 8 Z" />
    </marker>
  </defs>

  <rect class="store" x="12" y="8" width="146" height="52" rx="4" />
  <line class="rule" x1="16" y1="9.5" x2="154" y2="9.5" />
  <text class="name" x="24" y="30">SQLite file</text>
  <text class="note" x="24" y="47">opened read-only</text>

  <path class="edge" d="M130 60 V110" marker-end="url(#mtga-overlay-arrow)" />
  <text class="lbl" x="136" y="78">new rows only</text>

  <rect class="lane" x="2" y="88" width="336" height="186" rx="6" />
  <text class="lane-label" x="12" y="104">POLL THREAD</text>

  <rect class="box" x="12" y="112" width="146" height="66" rx="4" />
  <text class="name" x="24" y="134">Read model</text>
  <text class="note" x="24" y="151">polls every 250 ms</text>
  <text class="tech" x="24" y="167">data_version</text>

  <path class="edge" d="M158 138 H180" marker-end="url(#mtga-overlay-arrow)" />
  <text class="lbl" x="182" y="104">pushes rows</text>

  <rect class="box" x="182" y="112" width="146" height="52" rx="4" />
  <text class="name" x="194" y="134">Live tracker</text>
  <text class="note" x="194" y="151">reuses parser code</text>

  <path class="edge" d="M226 164 V210" marker-end="url(#mtga-overlay-arrow)" />
  <text class="lbl" x="232" y="191">hidden ids cut</text>

  <rect class="box" x="182" y="212" width="146" height="52" rx="4" />
  <text class="name" x="194" y="234">Live snapshot</text>
  <text class="note" x="194" y="251">37 allowed key paths</text>
  <circle class="node" cx="316" cy="212" r="4.5" />

  <path class="edge" d="M182 238 H160" marker-end="url(#mtga-overlay-arrow)" />

  <rect class="box" x="12" y="212" width="146" height="52" rx="4" />
  <text class="name" x="24" y="234">View state</text>
  <text class="note" x="24" y="251">snapshot plus record</text>

  <path class="edge" d="M130 264 V324" marker-end="url(#mtga-overlay-arrow)" />
  <text class="lbl" x="136" y="292">channel</text>

  <rect class="lane" x="2" y="302" width="336" height="100" rx="6" />
  <text class="lane-label" x="12" y="318">RENDER THREAD</text>

  <rect class="box" x="12" y="326" width="146" height="66" rx="4" />
  <text class="name" x="24" y="348">Renderer</text>
  <text class="note" x="24" y="365">never reads the store</text>
  <text class="tech" x="24" y="381">egui · glow</text>

  <path class="edge" d="M158 352 H180" marker-end="url(#mtga-overlay-arrow)" />
  <text class="lbl" x="182" y="318">draws</text>

  <rect class="box" x="182" y="326" width="146" height="52" rx="4" />
  <text class="name" x="194" y="348">Four boxes</text>
  <text class="note" x="194" y="365">drawn over the game</text>
</svg>
