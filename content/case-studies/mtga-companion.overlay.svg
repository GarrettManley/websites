<svg xmlns="http://www.w3.org/2000/svg" class="dgm" id="mtga-overlay" role="img" aria-labelledby="mtga-overlay-title" aria-describedby="mtga-overlay-desc" viewBox="0 0 340 424" width="440" height="549">
  <title id="mtga-overlay-title">The overlay: from a committed row to pixels</title>
  <desc id="mtga-overlay-desc">The overlay opens the SQLite file read-only. On the poll thread, a read model asks every 250 milliseconds, through SQLite's data_version, whether another connection has committed, reads the new raw rows and pushes them into a live tracker that reuses the parser's code. The tracker produces a live snapshot whose serialized fields are an allow-list of 37 key paths. A view state, the snapshot plus the record, crosses a channel to the render thread, where a renderer that never reads the store, built with egui on glow, draws four boxes over the game. The amber mark is on the live snapshot.</desc>
  <defs>
    <marker id="mtga-overlay-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="head" d="M0 0 L8 4 L0 8 Z"/></marker>
  </defs>

  <rect class="store" x="12" y="8" width="146" height="52" rx="4" />
  <line class="rule" x1="16" y1="9.5" x2="154" y2="9.5" />
  <text class="name" x="24" y="30">SQLite file</text>
  <text class="note" x="24" y="47">opened read-only</text>

  <path class="edge" d="M130 60 V116" marker-end="url(#mtga-overlay-arrow)" />
  <text class="lbl" x="136" y="80">new raw rows</text>

  <rect class="lane" x="2" y="92" width="336" height="192" rx="6" />
  <text class="lane-label" x="12" y="107">POLL THREAD</text>

  <rect class="box" x="12" y="116" width="146" height="66" rx="4" />
  <text class="name" x="24" y="138">Read model</text>
  <text class="note" x="24" y="155">polls every 250 ms</text>
  <text class="tech" x="24" y="171">data_version</text>

  <path class="edge" d="M158 149 H182" marker-end="url(#mtga-overlay-arrow)" />

  <rect class="box" x="182" y="116" width="146" height="66" rx="4" />
  <text class="name" x="194" y="138">Live tracker</text>
  <text class="note" x="194" y="155">reuses parser code</text>

  <path class="edge" d="M210 182 V222" marker-end="url(#mtga-overlay-arrow)" />
  <text class="lbl" x="216" y="206">hidden ids cut</text>

  <rect class="box" x="182" y="222" width="146" height="52" rx="4" />
  <text class="name" x="194" y="244">Live snapshot</text>
  <text class="note" x="194" y="261">37 allowed key paths</text>
  <circle class="node" cx="182" cy="222" r="4.5" />

  <path class="edge" d="M182 248 H158" marker-end="url(#mtga-overlay-arrow)" />

  <rect class="box" x="12" y="222" width="146" height="52" rx="4" />
  <text class="name" x="24" y="244">View state</text>
  <text class="note" x="24" y="261">snapshot plus record</text>

  <path class="edge" d="M130 274 V340" marker-end="url(#mtga-overlay-arrow)" />
  <text class="lbl" x="136" y="304">channel</text>

  <rect class="lane" x="2" y="316" width="336" height="100" rx="6" />
  <text class="lane-label" x="12" y="331">RENDER THREAD</text>

  <rect class="box" x="12" y="340" width="146" height="66" rx="4" />
  <text class="name" x="24" y="362">Renderer</text>
  <text class="note" x="24" y="379">never reads the store</text>
  <text class="tech" x="24" y="395">egui · glow</text>

  <path class="edge" d="M158 373 H182" marker-end="url(#mtga-overlay-arrow)" />

  <rect class="box" x="182" y="340" width="146" height="66" rx="4" />
  <text class="name" x="194" y="362">Four boxes</text>
  <text class="note" x="194" y="379">drawn over the game</text>
</svg>
