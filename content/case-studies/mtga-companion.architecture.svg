<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 564" width="440" height="689" role="img" aria-labelledby="mtga-arch-title mtga-arch-desc">
  <title id="mtga-arch-title">mtga-companion architecture</title>
  <desc id="mtga-arch-desc">A one-way pipeline. The game writes its log file. A single capture process stores every log entry in a raw store. A pure, versioned parser turns raw entries into derived tables. Fourteen SQL views and a statistics layer read the derived tables. An MCP server exposes fifteen read-only tools to Claude Code. A separate, read-only overlay process reads the raw store.</desc>
  <defs>
    <marker id="mtga-arch-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="var(--color-muted)" />
    </marker>
  </defs>
  <style>
    .box { fill: var(--color-raised); stroke: var(--color-border); stroke-width: 1; }
    .ext { fill: none; stroke: var(--color-muted); stroke-width: 1; stroke-dasharray: 4 3; }
    .edge { fill: none; stroke: var(--color-muted); stroke-width: 2; }
    .name { fill: var(--color-fg); font-size: 13px; font-weight: 500; }
    .note { fill: var(--color-muted); font-size: 11px; }
    .tier { fill: var(--color-muted); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-anchor: end; }
  </style>

  <rect class="ext" x="16" y="8" width="204" height="52" rx="4" />
  <text class="name" x="30" y="30">Player.log</text>
  <text class="note" x="30" y="47">the game's own log file</text>

  <path class="edge" d="M118 60 V86" marker-end="url(#mtga-arch-arrow)" />

  <rect class="box" x="16" y="88" width="204" height="52" rx="4" />
  <text class="name" x="30" y="110">Capture</text>
  <text class="note" x="30" y="127">one writer; stores before parsing</text>

  <path class="edge" d="M118 140 V166" marker-end="url(#mtga-arch-arrow)" />

  <rect class="box" x="16" y="168" width="204" height="52" rx="4" />
  <circle cx="16" cy="194" r="4.5" fill="var(--color-node)" />
  <text class="name" x="30" y="190">Raw store</text>
  <text class="note" x="30" y="207">every log entry, byte-exact</text>
  <text class="tier" x="208" y="186">RAW</text>

  <path class="edge" d="M118 220 V246" marker-end="url(#mtga-arch-arrow)" />
  <path class="edge" d="M220 194 H272 L290 212 V246" marker-end="url(#mtga-arch-arrow)" />

  <rect class="box" x="16" y="248" width="204" height="52" rx="4" />
  <text class="name" x="30" y="270">Parser</text>
  <text class="note" x="30" y="287">pure function, versioned</text>

  <rect class="box" x="232" y="248" width="116" height="52" rx="4" />
  <text class="name" x="244" y="270">Live overlay</text>
  <text class="note" x="244" y="287">read-only process</text>

  <path class="edge" d="M118 300 V326" marker-end="url(#mtga-arch-arrow)" />

  <rect class="box" x="16" y="328" width="204" height="52" rx="4" />
  <text class="name" x="30" y="350">Derived tables</text>
  <text class="note" x="30" y="367">matches, games, game state</text>
  <text class="tier" x="208" y="346">DERIVED</text>

  <path class="edge" d="M118 380 V406" marker-end="url(#mtga-arch-arrow)" />

  <rect class="box" x="16" y="408" width="204" height="52" rx="4" />
  <text class="name" x="30" y="430">Statistics</text>
  <text class="note" x="30" y="447">14 SQL views; n on every rate</text>
  <text class="tier" x="208" y="426">VIEWS</text>

  <path class="edge" d="M118 460 V486" marker-end="url(#mtga-arch-arrow)" />

  <rect class="box" x="16" y="488" width="204" height="52" rx="4" />
  <text class="name" x="30" y="510">MCP server</text>
  <text class="note" x="30" y="527">15 read-only tools, stdio</text>

  <path class="edge" d="M220 514 H230" marker-end="url(#mtga-arch-arrow)" />

  <rect class="ext" x="232" y="488" width="116" height="52" rx="4" />
  <text class="name" x="244" y="510">Claude Code</text>
  <text class="note" x="244" y="527">asks the questions</text>
</svg>
