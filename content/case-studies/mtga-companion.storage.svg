<svg xmlns="http://www.w3.org/2000/svg" class="dgm" id="mtga-storage" role="img" aria-labelledby="mtga-storage-title" aria-describedby="mtga-storage-desc" viewBox="0 0 340 416" width="440" height="538">
  <title id="mtga-storage-title">Storage layers and what a rebuild touches</title>
  <desc id="mtga-storage-desc">Raw entries are the only data that cannot be rebuilt. A versioned parser reads them in order and replaces rows in eighteen derived tables, stamping each run with its version. When the recorded version is older than the parser's, the next parse rebuilds every derived table in one transaction. Fourteen SQL views read the derived tables and a card reference, and never the raw entries.</desc>
  <defs>
    <marker id="mtga-storage-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="head" d="M0 0 L8 4 L0 8 Z" />
    </marker>
  </defs>

  <rect class="store" x="6" y="8" width="158" height="52" rx="4" />
  <line class="rule" x1="10" y1="9" x2="160" y2="9" />
  <text class="name" x="18" y="30">Raw entries</text>
  <text class="note" x="18" y="47">byte-exact, hashed</text>
  <circle class="node" cx="164" cy="34" r="4.5" />
  <text class="anno" x="176" y="38">cannot be rebuilt</text>

  <path class="edge" d="M40 60 V110" marker-end="url(#mtga-storage-arrow)" />
  <text class="lbl" x="46" y="90">in seq order</text>

  <rect class="box" x="6" y="112" width="158" height="66" rx="4" />
  <text class="name" x="18" y="134">Parser</text>
  <text class="note" x="18" y="151">function of raw rows</text>
  <text class="tech" x="18" y="167">version 4</text>

  <path class="edge" d="M150 112 V88 L156 82 H194 L200 88 V110" marker-end="url(#mtga-storage-arrow)" />
  <text class="lbl" x="206" y="97">stamps version</text>

  <rect class="store" x="176" y="112" width="158" height="52" rx="4" />
  <line class="rule" x1="180" y1="113" x2="330" y2="113" />
  <text class="name" x="188" y="134">Run history</text>
  <text class="note" x="188" y="151">one row per parse run</text>

  <path class="edge cond" d="M200 164 V198 L194 204 H156 L150 198 V180" marker-end="url(#mtga-storage-arrow)" />
  <text class="lbl" x="206" y="186">older: rebuild</text>

  <path class="edge" d="M40 178 V230" marker-end="url(#mtga-storage-arrow)" />
  <text class="lbl" x="46" y="201">per match</text>

  <rect class="lane" x="2" y="216" width="336" height="84" rx="6" />
  <text class="lane-label" x="188" y="254">REBUILT IN <tspan x="188" dy="17">ONE TRANSACTION</tspan></text>

  <rect class="store" x="6" y="232" width="158" height="52" rx="4" />
  <line class="rule" x1="10" y1="233" x2="160" y2="233" />
  <text class="name" x="18" y="254">Derived tables</text>
  <text class="note" x="18" y="271">18 rebuildable tables</text>

  <path class="edge" d="M40 284 V340" marker-end="url(#mtga-storage-arrow)" />
  <text class="lbl" x="46" y="324">read</text>

  <rect class="store" x="6" y="342" width="158" height="66" rx="4" />
  <line class="rule" x1="10" y1="343" x2="160" y2="343" />
  <text class="name" x="18" y="364">Statistics views</text>
  <text class="note" x="18" y="381">14 SQL views</text>
  <text class="tech" x="18" y="397">no raw-table reads</text>

  <path class="edge" d="M200 342 V318 L194 312 H156 L150 318 V340" marker-end="url(#mtga-storage-arrow)" />
  <text class="lbl" x="206" y="327">card facts</text>

  <rect class="store" x="176" y="342" width="158" height="52" rx="4" />
  <line class="rule" x1="180" y1="343" x2="330" y2="343" />
  <text class="name" x="188" y="364">Card reference</text>
  <text class="note" x="188" y="381">names, colours, costs</text>
</svg>
