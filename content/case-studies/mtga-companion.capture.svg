<svg xmlns="http://www.w3.org/2000/svg" class="dgm" id="mtga-capture" role="img" aria-labelledby="mtga-capture-title" aria-describedby="mtga-capture-desc" viewBox="0 0 340 450" width="440" height="582">
  <title id="mtga-capture-title">Capture: from a log append to a committed row</title>
  <desc id="mtga-capture-desc">A reader takes new bytes from the game's log, starting at an offset stored in the database. A grouper frames them into whole entries. One transaction inserts the entries into the raw table with INSERT OR IGNORE and updates the session's offset. A guarded parse, wrapped in catch_unwind, reads only committed rows: it runs when capture attaches to a log, after a match ends and after the log rotates, and its failure is recorded without stopping capture. A transient file error is retried up to twenty times in a row. The amber mark is on the raw insert, the commit point.</desc>
  <defs>
    <marker id="mtga-capture-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="head" d="M0 0 L8 4 L0 8 Z"/></marker>
  </defs>

  <!-- Game log (not part of this system) -->
  <rect class="ext" x="12" y="8" width="158" height="52" rx="4" />
  <text class="name" x="24" y="30">Game log</text>
  <text class="note" x="24" y="47">written by the game</text>

  <!-- 1. Game log to Log reader -->
  <path class="edge" d="M46 60 V100" marker-end="url(#mtga-capture-arrow)" />
  <text class="lbl" x="52" y="84">shared read</text>

  <!-- 6. Session row to Log reader, on start only: the return rail up the right-hand side.
       A dashed edge ends in a solid 8-unit run that carries the arrowhead. -->
  <path class="edge cond" d="M311 416 H323 L329 410 V82 L323 76 H162 L156 82 V92" />
  <path class="edge" d="M156 92 V100" marker-end="url(#mtga-capture-arrow)" />
  <text class="lbl" x="210" y="69">resume offset</text>

  <!-- 8. Log reader to itself, on a transient file error only -->
  <path class="edge cond" d="M171 112 H198 L204 118 V134 L198 140 H178" />
  <path class="edge" d="M178 140 H170" marker-end="url(#mtga-capture-arrow)" />
  <text class="lbl" x="210" y="130">retry, max 20</text>

  <!-- Log reader -->
  <rect class="box" x="12" y="100" width="158" height="52" rx="4" />
  <text class="name" x="24" y="122">Log reader</text>
  <text class="note" x="24" y="139">from a stored offset</text>

  <!-- 2. Log reader to Entry grouper -->
  <path class="edge" d="M46 152 V192" marker-end="url(#mtga-capture-arrow)" />
  <text class="lbl" x="52" y="176">byte chunks</text>

  <!-- Entry grouper -->
  <rect class="box" x="12" y="192" width="158" height="52" rx="4" />
  <text class="name" x="24" y="214">Entry grouper</text>
  <text class="note" x="24" y="231">bytes to entries</text>

  <!-- 3. Entry grouper to Raw insert -->
  <path class="edge" d="M46 244 V284" marker-end="url(#mtga-capture-arrow)" />
  <text class="lbl" x="52" y="268">whole entries</text>

  <!-- 7. Raw insert to Guarded parse, only on attach, after a match ends and after a rotation.
       The label is centred on the vertical run it sits beside, not on the other column's baseline. -->
  <path class="edge cond" d="M156 283 V266 L162 260 H198 L204 266 V276" />
  <path class="edge" d="M204 276 V284" marker-end="url(#mtga-capture-arrow)" />
  <text class="lbl" x="210" y="276">after commit</text>

  <!-- Raw insert: the commit point, marked in amber -->
  <rect class="box" x="12" y="284" width="158" height="66" rx="4" />
  <circle class="node" cx="12" cy="317" r="4.5" />
  <text class="name" x="24" y="306">Raw insert</text>
  <text class="note" x="24" y="323">one transaction</text>
  <text class="tech" x="24" y="339">INSERT OR IGNORE</text>

  <!-- Guarded parse -->
  <rect class="box" x="192" y="284" width="118" height="66" rx="4" />
  <text class="name" x="204" y="306">Guarded parse</text>
  <text class="note" x="204" y="323">failure recorded</text>
  <text class="tech" x="204" y="339">catch_unwind</text>

  <!-- 4. Raw insert to Raw entries -->
  <path class="edge" d="M46 350 V390" marker-end="url(#mtga-capture-arrow)" />
  <text class="lbl" x="52" y="374">idempotent</text>

  <!-- 5. Raw insert to Session row -->
  <path class="edge" d="M156 350 V360 L162 366 H198 L204 372 V390" marker-end="url(#mtga-capture-arrow)" />
  <text class="lbl" x="210" y="382">same commit</text>

  <!-- Raw entries (data at rest) -->
  <rect class="store" x="12" y="390" width="158" height="52" rx="4" />
  <line class="rule" x1="16" y1="391.5" x2="166" y2="391.5" />
  <text class="name" x="24" y="412">Raw entries</text>
  <text class="note" x="24" y="429">keyed by session, seq</text>

  <!-- Session row (data at rest) -->
  <rect class="store" x="192" y="390" width="118" height="52" rx="4" />
  <line class="rule" x1="196" y1="391.5" x2="306" y2="391.5" />
  <text class="name" x="204" y="412">Session row</text>
  <text class="note" x="204" y="429">offset, count</text>
</svg>
